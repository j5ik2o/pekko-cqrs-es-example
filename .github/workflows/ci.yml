name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aislop:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event.action == 'edited' && '0' || '1' }}

      - &merge_edited_pr
        name: Prepare merge with the edited PR base
        if: github.event.action == 'edited'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test -n "$PR_BASE_SHA"
          test -n "$PR_HEAD_SHA"
          expected_parents="$PR_BASE_SHA $PR_HEAD_SHA"

          # The pull request merge ref can still point to the previous base.
          if [ "$(git show -s --format=%P HEAD)" != "$expected_parents" ]; then
            git switch --detach "$PR_BASE_SHA"
            git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              merge --no-ff --no-edit "$PR_HEAD_SHA"
          fi

          actual_parents=$(git show -s --format=%P HEAD)
          test "$actual_parents" = "$expected_parents"
          printf 'Testing merge %s with parents %s\n' "$(git rev-parse HEAD)" "$actual_parents"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install aislop
        run: npm ci

      - name: Run aislop check
        run: npm run check:aislop

      - name: Run aislop tests
        run: npm run test:aislop

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event.action == 'edited' && '0' || '1' }}

      - *merge_edited_pr

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Verify E2E CLI response fixtures (fake transport)
        run: python3 scripts/test-e2e-response-fixtures.py .

      - name: Upload E2E CLI fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-response-fixture-logs
          path: target/e2e-response-fixtures/
          if-no-files-found: ignore

      - name: Compile
        run: sbt -batch compile
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Test
        run: sbt -batch test
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Lint
        run: sbt -batch lint
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: PPD command-api and migration smoke
        run: python3 scripts/test-ppd-smoke.py
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Upload PPD smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppd-smoke-logs
          path: target/ppd-smoke/
          if-no-files-found: ignore

      - name: Build APIs for stream E2E
        run: sbt -batch dockerBuildAll
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Start LocalStack and PostgreSQL E2E
        run: |
          docker compose -f docker-compose-common.yml -f docker-compose-local.yml up -d localstack postgres flyway dynamodb-setup command-api-1 query-api
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:50501/api/health
          curl --fail --retry 60 --retry-delay 2 --retry-all-errors http://localhost:50502/api/health

      - name: Deploy RMU stream consumer
        run: bash scripts/deploy-lambda-localstack.sh
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Verify command to stream to query E2E
        run: bash scripts/test-e2e.sh
        env:
          E2E_MAX_RETRIES: "30"
          E2E_RETRY_DELAY: "3"

      - name: Verify notification after the read model update
        run: python3 scripts/test-rmu-notification.py

      - name: Collect stream E2E logs
        if: always()
        run: |
          mkdir -p target/stream-e2e
          docker compose -f docker-compose-common.yml -f docker-compose-local.yml logs --no-color > target/stream-e2e/compose.log 2>&1

      - name: Upload stream E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-e2e-logs
          path: target/stream-e2e/

      - name: Stop E2E services
        if: always()
        run: docker compose -f docker-compose-common.yml -f docker-compose-local.yml down

  required:
    name: CI required
    needs: [aislop, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require all CI jobs to succeed
        env:
          AISLOP_RESULT: ${{ needs.aislop.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf 'aislop=%s build=%s\n' "$AISLOP_RESULT" "$BUILD_RESULT"
          test "$AISLOP_RESULT" = success && test "$BUILD_RESULT" = success
