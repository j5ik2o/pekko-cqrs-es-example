name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  aislop:
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record the pull request event
        run: |
          jq -c --arg tested_sha "$GITHUB_SHA" '{action, old_base: .changes.base.ref.from, base: .pull_request.base.ref, base_sha: .pull_request.base.sha, head_sha: .pull_request.head.sha, tested_sha: $tested_sha}' "$GITHUB_EVENT_PATH"

  required:
    name: CI required
    needs: [aislop, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require all CI jobs to succeed
        env:
          AISLOP_RESULT: ${{ needs.aislop.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf 'aislop=%s build=%s\n' "$AISLOP_RESULT" "$BUILD_RESULT"
          test "$AISLOP_RESULT" = success && test "$BUILD_RESULT" = success
