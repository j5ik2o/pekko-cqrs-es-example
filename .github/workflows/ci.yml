name: CI

on: pull_request

permissions:
  contents: read

jobs:
  aislop:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - run: exit 0

  required:
    name: CI required
    needs: [aislop, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require all CI jobs to succeed
        env:
          AISLOP_RESULT: ${{ needs.aislop.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          printf 'aislop=%s build=%s\n' "$AISLOP_RESULT" "$BUILD_RESULT"
          test "$AISLOP_RESULT" = success && test "$BUILD_RESULT" = success
