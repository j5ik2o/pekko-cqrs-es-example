name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Compile
        run: sbt -batch compile
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Test
        run: sbt -batch test
        env:
          PROTOC_PATH: /usr/bin/protoc

      - name: Lint
        run: sbt -batch lint
        env:
          PROTOC_PATH: /usr/bin/protoc
