pekko {
  http {
    server {
      preview {
        enable-http2 = on
      }
      http2 {
        enabled = on
      }
    }
  }
  actor {
    provider = local

    cluster {
      enabled = false
      enabled = ${?PEKKO_CLUSTER_ENABLED}
    }

    warn-about-java-serializer-usage = on
    allow-java-serialization = off

  }

  # Cluster Sharding は1つのエンティティに書き手が1つだけという前提に立つ。
  # downing の仕組みがないと、ネットワークの分断で両側が同じ集約を起動し、
  # 同じ persistence id に2つの書き手が追記する。
  cluster {
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    split-brain-resolver {
      active-strategy = keep-majority
    }
  }

  test {
    single-expect-default = 5s
    filter-leeway = 5s
    timefactor = 1.0
  }
  coordinated-shutdown.run-by-actor-system-terminate = off
}

pekko.persistence.journal.plugin = "j5ik2o.dynamo-db-journal"
pekko.persistence.snapshot-store.plugin = "j5ik2o.dynamo-db-snapshot"
pekko.persistence.state.plugin = "j5ik2o.dynamo-db-state"

